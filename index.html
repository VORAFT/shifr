<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Шифр простої перестановки</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

    <div class="container">
        <h1>Шифр простої перестановки</h1>
        <p>Цей сайт шифрує та розшифровує текст за допомогою методу простої перестановки.</p>

        <div class="pform">
            <label for="key">Ключ (кількість стовпців у таблиці):</label>
            <input type="number" id="key" min="2" value="5" placeholder="Введіть число наприклад 5">
        </div>

        <div class="pform">
            <label for="inputText">Введіть текст:</label>
            <textarea id="inputText" rows="6" placeholder="Напишіть ваш текст:"></textarea>
        </div>

        <div class="buttons">
            <button id="sufr">Зашифрувати</button>
            <button id="undsufr">Розшифрувати</button>
        </div>

        <div class="pform">
            <label for="outputText">Результат:</label>
            <textarea id="outputText" rows="6" readonly></textarea>
        </div>
    </div>

    <script src="script.js"></script>

    </body>
</html>
